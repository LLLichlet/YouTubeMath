    title: "The Classification of Extended Topological Field Theories"
    speaker: Jacob Lurie
    url: https://www.youtube.com/watch?v=svsidHyNk1k
    duration: "01:42:00"
    files:
      en_srt: subtitles/svsidHyNk1k.en.srt
      zh_srt: subtitles/svsidHyNk1k.zh.srt

